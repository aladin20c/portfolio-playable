<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <title>Alaeddine Cheniour</title>

  </head>

    <body>

      <div id="images">
        <img id="layer0" src="assets/layer0.png" alt="layer">
        <img id="layer1" src="assets/layer1.png" alt="layer">
        <img id="layer2" src="assets/layer2.png" alt="layer">
        <img id="layer3" src="assets/layer3.png" alt="layer" >
        <img id="up" src="assets/up.png" alt="test" >
        <img id="down" src="assets/down.png" alt="test" >
        <img id="left" src="assets/left.png" alt="test" >
        <img id="right" src="assets/right.png" alt="test" >
        <img id="porte01" src="assets/porte01.png" alt="test" >
        <img id="porte02" src="assets/porte02.png" alt="test" >
        <img id="arc" src="assets/arc.png" alt="layer">
        <img id="eiffel" src="assets/eiffel.png" alt="layer">
        <img id="notre_dame" src="assets/notre_dame.png" alt="layer">
        <img id="polytech_building" src="assets/polytech_building.png" alt="layer" >
        <img id="guitar_player" src="assets/guitar_player.png" alt="layer" >
        <img id="music_animation" src="assets/music_animation.png" alt="layer" >
        <img id="satellite" src="assets/satellite.png" alt="layer" >
        <img id="paris_cite" src="assets/paris_cite.png" alt="layer" >
        <img id="gameBoy" src="assets/gameBoy.png" alt="layer" >
        <img id="smabtp" src="assets/smabtp.png" alt="layer" >
        <img id="polytech_logo" src="assets/polytech_logo.png" alt="layer" >
        <img id="sprite" src="assets/sprite.png" alt="layer" >
        <img id="ouidou" src="assets/ouidou.png" alt="layer" >
        <img id="ds" src="assets/ds.png" alt="layer" >
        <img id="meditwin" src="assets/meditwin.png" alt="layer" >
      </div>

      <div id="sounds">
        <audio id="jump" src="sound/jump.wav" preload="auto"></audio>
        <audio id="footsteps" src="sound/footsteps.wav" preload="auto"></audio>
        <audio id="hello" src="sound/hello.wav" preload="auto"></audio>
        <audio id="earthquake" src="sound/earthquake.mp3" preload="auto"></audio>
      </div>

      <div id="main-container">
        <div id="canvas-container">
          <canvas id="canvas"></canvas>

          <div id="touch-controls">
            <div id="touch-jump" class="touch-zone">▲</div>
            <div id="move-buttons">
              <div id="touch-left" class="touch-zone">◀︎</div>
              <div id="touch-right" class="touch-zone">▶︎</div>
            </div>
          </div>

          <div id="loading-screen">
            <div class="spinner"></div>
            <div class="loading-text">Loading<span class="dots"></span></div>
          </div>
        </div>
      </div>



    </body>
  <script src="physics.js"></script>
  <script src="main.js"></script>
</html>
